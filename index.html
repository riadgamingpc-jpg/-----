<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS Arena - Tournament App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f7f9fc; padding-bottom: 100px; }
        header { background-color: #fff; padding: 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100; }
        .wallet-badge { background-color: #ede7f6; color: #673ab7; padding: 6px 14px; border-radius: 20px; font-weight: bold; }
        .container { max-width: 500px; margin: 0 auto; padding: 15px; }
        .deposit-card { background-color: #512da8; color: #fff; border-radius: 16px; padding: 18px; margin-bottom: 25px; }
        .app-card { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .btn-confirm { width: 100%; background-color: #673ab7; color: #fff; border: none; padding: 12px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        .room-details-box { display: none; background: #fff3cd; padding: 10px; border-radius: 8px; margin-top: 10px; text-align: center; border: 1px dashed #ffc107; }
        .input-field { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .toast-error { position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%); background-color: #212121; color: #fff; padding: 14px 20px; border-radius: 25px; display: none; z-index: 1000; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">RS Arena</div>
        <div class="wallet-badge">💰 Wallet: ৳<span id="userBalance">500</span></div>
    </header>

    <div class="container">
        <!-- টাকা অ্যাড সেকশন -->
        <div class="deposit-card">
            <h3>📥 টাকা অ্যাড করুন</h3>
            <p style="font-size: 13px;">বিকাশ/নগদ: 01851634841</p>
            <input type="number" class="input-field" id="amt" placeholder="টাকার পরিমাণ">
            <input type="text" class="input-field" id="trx" placeholder="Transaction ID">
            <button class="btn-confirm" style="background:#ffc107; color:#000;" onclick="requestDeposit()">রিকুয়েস্ট পাঠান</button>
        </div>

        <div id="matchList"></div>
    </div>

    <div class="toast-error" id="toastMsg">পর্যাপ্ত ব্যালেন্স নেই! আগে টাকা অ্যাড করুন।</div>

    <script>
        let balance = 500;
        const matches = [
            { id: "m1", title: "Free Fire Solo Match", fee: 20 },
            { id: "m2", title: "4vs4 Clash Squad", fee: 50 },
            { id: "m3", title: "BR Match #18", fee: 10 }
        ];

        function requestDeposit() {
            let amt = document.getElementById('amt').value;
            if(amt) {
                alert("আপনার রিকোয়েস্টটি পেন্ডিং আছে। অ্যাডমিন যাচাই করলে ব্যালেন্স আপডেট হবে!");
            }
        }

        let container = document.getElementById('matchList');
        matches.forEach(m => {
            container.innerHTML += `
            <div class="app-card">
                <b>${m.title}</b><br> এন্ট্রি ফি: ${m.fee} TK
                <div id="joinArea_${m.id}">
                    <input type="text" class="input-field" id="name_${m.id}" placeholder="গেমের নাম">
                    <input type="text" class="input-field" id="phone_${m.id}" placeholder="মোবাইল নম্বর">
                    <button class="btn-confirm" onclick="joinMatch('${m.id}', ${m.fee})">জয়েন করুন</button>
                </div>
                <div class="room-details-box" id="room_${m.id}">
                    🔑 রুম আইডি: 998877 | পাসওয়ার্ড: 1234
                </div>
            </div>`;
        });

        function joinMatch(id, fee) {
            if(balance >= fee) {
                balance -= fee;
                document.getElementById('userBalance').innerText = balance;
                document.getElementById('joinArea_'+id).style.display = 'none';
                document.getElementById('room_'+id).style.display = 'block';
                alert("জয়েনিং সফল হয়েছে! মেসেজ চেক করুন।");
            } else {
                let toast = document.getElementById('toastMsg');
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 3000);
            }
        }
    </script>
</body>
</html>
